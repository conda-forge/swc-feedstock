context:
  version: "1.15.40"

package:
  name: swc
  version: ${{ version }}

source:
  url: https://github.com/swc-project/swc/archive/v${{ version }}.tar.gz
  sha256: 3773f1003b9c7750a8bfc60aea9d9816df01b3f0856cc37e58b7108c28f0e5e2

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - script:
      - swc --help

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Rust-based platform for the Web
  homepage: https://github.com/swc-project/swc
  repository: https://github.com/swc-project/swc

extra:
  recipe-maintainers:
    - danielnachun
